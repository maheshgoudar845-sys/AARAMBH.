<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin — AARAMBH</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="site-config.js"></script>
  <style>
    :root{--bg:#080810;--accent:#A90E02;--accent2:#FFFACD;--text:#f0f0f0;--muted:#888;--border:rgba(255,255,255,.1);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px 80px;}
    .wrap{max-width:900px;margin:0 auto;}
    h1{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:1px;margin-bottom:20px;}
    h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin:0 0 14px;}
    .box{background:#12121c;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px;}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
    input,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font:inherit;font-size:15px;margin-bottom:14px;}
    select option{background:#15151f;}
    input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;}
    button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
    button.small{padding:8px 12px;font-size:12px;}
    button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
    button:disabled{opacity:.5;cursor:not-allowed;}
    .msg{font-size:14px;margin-top:12px;min-height:18px;}
    .msg.ok{color:#9be6b4;} .msg.err{color:#ff8f8f;}
    .ex{border-top:1px dashed var(--border);padding:14px 0;font-size:14px;line-height:1.7;}
    .ex:first-child{border-top:none;}
    .ex b{color:var(--accent2);}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}

    /* Orders list */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
    .stat{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:12px;}
    .stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent2);}
    .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
    .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
    .bar input{flex:2;min-width:180px;margin-bottom:8px;}
    .bar select{flex:1;min-width:140px;margin-bottom:8px;}
    .order{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.02);}
    .order .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
    .ref{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--accent2);}
    .date{font-size:12px;color:var(--muted);}
    .order select.st{width:auto;min-width:160px;margin-bottom:0;}
    .items div{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--border);display:flex;justify-content:space-between;gap:10px;}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13px;line-height:1.6;color:var(--muted);}
    .meta b{color:var(--text);}
    .meta a{color:var(--accent2);text-decoration:none;}
    .pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:100px;background:rgba(255,250,205,.12);color:var(--accent2);}
    .pill.paid{background:rgba(155,230,180,.15);color:#9be6b4;}
    @media(max-width:640px){.stats{grid-template-columns:1fr 1fr;}.meta{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AARAMBH Admin</h1>

    <div class="box">
      <h2>Admin key</h2>
      <label for="key">Kept only for this browser tab. It is cleared when you close the tab.</label>
      <input id="key" type="password" autocomplete="off" placeholder="Your ADMIN_KEY">
    </div>

    <div class="box">
      <div class="row">
        <h2>All orders</h2>
        <div class="actions" style="margin-top:0;">
          <button id="loadOrders" class="small" type="button">Load orders</button>
          <button id="csvBtn" class="small ghost" type="button">Download CSV</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b id="sOrders">0</b><span>Orders</span></div>
        <div class="stat"><b id="sPieces">0</b><span>Pieces</span></div>
        <div class="stat"><b id="sRevenue">₹0</b><span>Revenue</span></div>
        <div class="stat"><b id="sPending">0</b><span>To ship</span></div>
      </div>
      <div class="bar">
        <input type="search" id="search" placeholder="Search order ID, name, phone, email">
        <select id="statusFilter"><option value="">All statuses</option></select>
      </div>
      <div id="orderList"><p class="msg">Press Load orders.</p></div>
    </div>

    <div class="box">
      <h2>Update order status by reference ID</h2>
      <label for="ref">Reference ID</label>
      <input id="ref" maxlength="24" autocomplete="off" placeholder="e.g. 5F3A9C21">
      <label for="status">New status</label>
      <select id="status">
        <option value="placed">Placed</option>
        <option value="confirmed">Confirmed</option>
        <option value="shipped">Shipped</option>
        <option value="out_for_delivery">Out for delivery</option>
        <option value="delivered">Delivered (starts the 3-day exchange window)</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button id="save" type="button">Update status</button>
      <div class="msg" id="saveMsg" role="status"></div>
    </div>

    <div class="box">
      <div class="row">
        <h2>Open exchange requests</h2>
        <button id="loadEx" class="small ghost" type="button">Load requests</button>
      </div>
      <div id="exList"><p class="msg">Press Load requests.</p></div>
    </div>
  </div>

  <script>
    const API = window.AARAMBH_BACKEND_URL || '';
    const $ = (id) => document.getElementById(id);
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const STATUSES = ['placed', 'confirmed', 'shipped', 'out_for_delivery', 'delivered', 'cancelled'];
    const LABEL = { placed: 'Placed', confirmed: 'Confirmed', shipped: 'Shipped', out_for_delivery: 'Out for delivery', delivered: 'Delivered', cancelled: 'Cancelled' };
    const fmtDate = (d) => new Date(d).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    let ALL = [];

    STATUSES.forEach((s) => $('statusFilter').add(new Option(LABEL[s], s)));

    $('key').value = sessionStorage.getItem('aarambhAdminKey') || '';
    $('key').addEventListener('input', () => sessionStorage.setItem('aarambhAdminKey', $('key').value.trim()));

    async function adminApi(path, method, body) {
      const key = $('key').value.trim();
      if (!key) throw new Error('Enter your admin key first.');
      const res = await fetch(API + path, {
        method,
        headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
        body: body ? JSON.stringify(body) : undefined
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || 'Something went wrong.');
      return out;
    }

    /* ---------- All orders ---------- */
    function pieces(o) { return o.items.reduce((s, i) => s + (i.qty || 0), 0); }

    function renderOrders() {
      const q = $('search').value.trim().toLowerCase();
      const sf = $('statusFilter').value;
      const rows = ALL.filter((o) => {
        if (sf && o.orderStatus !== sf) return false;
        if (!q) return true;
        return [o.ref, o.name, o.phone, o.email].some((v) => String(v || '').toLowerCase().includes(q));
      });

      const live = ALL.filter((o) => o.orderStatus !== 'cancelled');
      $('sOrders').textContent = live.length;
      $('sPieces').textContent = live.reduce((s, o) => s + pieces(o), 0);
      $('sRevenue').textContent = '₹' + live.reduce((s, o) => s + (o.total || 0), 0);
      $('sPending').textContent = ALL.filter((o) => o.orderStatus === 'placed' || o.orderStatus === 'confirmed').length;

      if (!rows.length) { $('orderList').innerHTML = '<p class="msg">No orders found.</p>'; return; }

      $('orderList').innerHTML = rows.map((o) => {
        const items = o.items.map((i) =>
          '<div><span>' + esc(i.name) + (i.size ? ' (' + esc(i.size) + ')' : '') + ' × ' + esc(i.qty) + '</span><span>₹' + esc(i.price * i.qty) + '</span></div>'
        ).join('');
        const opts = STATUSES.map((s) => '<option value="' + s + '"' + (s === o.orderStatus ? ' selected' : '') + '>' + LABEL[s] + '</option>').join('');
        const wa = 'https://wa.me/91' + esc(o.phone) + '?text=' + encodeURIComponent('Hi ' + (o.name || '') + ', this is AARAMBH about your order ' + o.ref + '.');
        const exNote = o.exchange ? '<div class="meta" style="grid-template-columns:1fr;"><div><b>Exchange:</b> ' + esc(o.exchange.status) + ' (new size ' + esc(o.exchange.newSize) + ')</div></div>' : '';
        return '<div class="order">' +
          '<div class="top"><div><div class="ref">' + esc(o.ref) + '</div><div class="date">' + esc(fmtDate(o.createdAt)) + '</div></div>' +
          '<select class="st" data-ref="' + esc(o.ref) + '">' + opts + '</select></div>' +
          '<div class="items">' + items + '</div>' +
          '<div class="meta">' +
            '<div><b>' + pieces(o) + ' piece(s) · ₹' + esc(o.total) + '</b><br>' +
              'Subtotal ₹' + esc(o.subtotal) + (o.discount ? ' · Discount −₹' + esc(o.discount) + (o.coupon ? ' (' + esc(o.coupon) + ')' : '') : '') + ' · Delivery ₹' + esc(o.delivery) + '<br>' +
              '<span class="pill ' + (o.payment === 'paid' ? 'paid' : '') + '">' + (o.payment === 'paid' ? 'Paid online' : 'Cash on delivery') + '</span></div>' +
            '<div><b>' + esc(o.name) + '</b><br><a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a> · <a href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a><br>' +
              esc(o.email) + '<br>' + esc(o.address) + '</div>' +
          '</div>' +
          (o.notes ? '<div class="meta" style="grid-template-columns:1fr;"><div><b>Notes:</b> ' + esc(o.notes) + '</div></div>' : '') +
          exNote +
        '</div>';
      }).join('');
    }

    async function loadOrders() {
      $('orderList').innerHTML = '<p class="msg">Loading… (the server can take up to a minute to wake up)</p>';
      try {
        const out = await adminApi('/api/admin/orders', 'GET');
        ALL = out.orders || [];
        renderOrders();
      } catch (e) { $('orderList').innerHTML = '<p class="msg err">' + esc(e.message) + '</p>'; }
    }
    $('loadOrders').addEventListener('click', loadOrders);
    $('search').addEventListener('input', renderOrders);
    $('statusFilter').addEventListener('change', renderOrders);

    $('orderList').addEventListener('change', async (e) => {
      const el = e.target;
      if (!el.classList.contains('st')) return;
      const ref = el.dataset.ref;
      const order = ALL.find((o) => o.ref === ref);
      try {
        await adminApi('/api/admin/orders/' + encodeURIComponent(ref) + '/status', 'PATCH', { orderStatus: el.value });
        order.orderStatus = el.value;
      } catch (err) { alert(err.message); }
      renderOrders();
    });

    $('csvBtn').addEventListener('click', () => {
      if (!ALL.length) { alert('Load the orders first.'); return; }
      const cell = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const head = ['Order ID', 'Date', 'Name', 'Phone', 'Email', 'Items', 'Pieces', 'Total', 'Payment', 'Status', 'Address'];
      const lines = [head.map(cell).join(',')].concat(ALL.map((o) => [
        o.ref, fmtDate(o.createdAt), o.name, o.phone, o.email,
        o.items.map((i) => i.name + ' (' + i.size + ') x' + i.qty).join('; '),
        pieces(o), o.total, o.payment === 'paid' ? 'Paid online' : 'COD', LABEL[o.orderStatus], o.address
      ].map(cell).join(',')));
      const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'AARAMBH-orders.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    /* ---------- Update status by reference ID ---------- */
    $('save').addEventListener('click', async () => {
      const ref = $('ref').value.replace(/[^a-z0-9]/gi, '').toUpperCase();
      const m = $('saveMsg');
      if (!ref) { m.className = 'msg err'; m.textContent = 'Enter the reference ID.'; return; }
      $('save').disabled = true;
      m.className = 'msg'; m.textContent = 'Updating… (the server can take up to a minute to wake up)';
      try {
        const out = await adminApi('/api/admin/orders/' + encodeURIComponent(ref) + '/status', 'PATCH', { orderStatus: $('status').value });
        m.className = 'msg ok'; m.textContent = 'Order ' + out.ref + ' is now: ' + out.orderStatus;
        const o = ALL.find((x) => x.ref === out.ref);
        if (o) { o.orderStatus = out.orderStatus; renderOrders(); }
      } catch (e) { m.className = 'msg err'; m.textContent = e.message; }
      $('save').disabled = false;
    });

    /* ---------- Exchange requests ---------- */
    async function loadExchanges() {
      const list = $('exList');
      list.innerHTML = '<p class="msg">Loading…</p>';
      try {
        const out = await adminApi('/api/admin/exchanges', 'GET');
        const ex = out.exchanges || [];
        list.innerHTML = ex.length ? ex.map((x) => `
          <div class="ex">
            <b>${esc(x.ref)}</b> — ${esc(x.customer)} (${esc(x.phone)}, ${esc(x.email)})<br>
            ${esc(x.item)}: size ${esc(x.currentSize)} → <b>${esc(x.newSize)}</b><br>
            Reason: ${esc(x.reason || 'Not given')}
            <div class="actions" data-ref="${esc(x.ref)}">
              <button class="small" data-s="approved" type="button">Approve</button>
              <button class="small ghost" data-s="rejected" type="button">Reject</button>
              <button class="small ghost" data-s="completed" type="button">Mark completed</button>
            </div>
          </div>`).join('') : '<p class="msg">No open exchange requests.</p>';
      } catch (e) { list.innerHTML = '<p class="msg err">' + esc(e.message) + '</p>'; }
    }
    $('loadEx').addEventListener('click', loadExchanges);

    $('exList').addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-s]');
      if (!b) return;
      const ref = b.parentElement.dataset.ref;
      b.disabled = true;
      try {
        await adminApi('/api/admin/orders/' + encodeURIComponent(ref) + '/exchange', 'PATCH', { status: b.dataset.s });
        loadExchanges();
      } catch (err) { alert(err.message); b.disabled = false; }
    });
  </script>
</body>
</html>
