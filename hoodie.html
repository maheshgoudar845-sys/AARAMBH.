<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hoodie Collection — AARAMBH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="site-config.js"></script>

  <style>
    :root {
      --bg: #080810;
      --surface: #0f0f1a;
      --accent: #F4772E;
      --accent2: #A90E02;
      --amber: #FFB238;
      --cream: #F5F1E8;
      --text: #F5F1E8;
      --muted: #888;
      --border: rgba(255,255,255,0.06);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; cursor: none; }

    .cursor { position: fixed; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; mix-blend-mode: difference; }
    .cursor-ring { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(244,119,46,0.5); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: transform 0.15s ease, width 0.3s, height 0.3s; }

    @media (hover: none), (pointer: coarse) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
    }

    body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 9997; opacity: 0.5; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; background: rgba(8,8,16,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); transition: padding 0.3s; }
    nav.scrolled { padding: 12px 40px; }
    .nav-logo img { height: 44px; }
    .nav-links { display: flex; gap: clamp(18px, 2.3vw, 36px); list-style: none; }
    .nav-links a { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; position: relative; transition: color 0.3s; }
    .nav-links a::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 0; height: 1px; background: var(--accent); transition: width 0.3s; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
    .nav-links a.active { color: var(--accent); }
    .nav-cta { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: white; background: var(--accent); padding: 10px 24px; border-radius: 100px; text-decoration: none; transition: background 0.3s, transform 0.2s; box-shadow: 0 4px 20px rgba(244,119,46,0.3); }
    .nav-cta:hover { background: #d9621f; transform: scale(1.04); }

    .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; z-index: 200; }
    .hamburger span { width: 24px; height: 2px; background: var(--text); border-radius: 2px; transition: transform 0.3s, opacity 0.3s; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      position: fixed; top: 0; right: 0; height: 100vh; width: min(78vw, 320px);
      background: #0c0c16; border-left: 1px solid var(--border);
      z-index: 150; padding: 100px 32px 40px;
      transform: translateX(100%); transition: transform 0.4s ease;
      display: flex; flex-direction: column; gap: 26px;
    }
    .mobile-menu.open { transform: translateX(0); }
    .mobile-menu a { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--text); text-decoration: none; }
    .mobile-menu a.active { color: var(--accent); }
    .menu-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      z-index: 140; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .menu-backdrop.open { opacity: 1; pointer-events: auto; }

    .page-header { min-height: 42vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 130px 40px 60px; text-align: center; position: relative; overflow: hidden; }
    .page-header::before { content: ''; position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(233,78,44,0.22) 0%, rgba(169,14,2,0.08) 45%, transparent 70%); top: -100px; left: 50%; transform: translateX(-50%); animation: pulse 6s ease-in-out infinite; }
    .page-header::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(244,119,46,0.08) 1px, transparent 1px); background-size: 40px 40px; animation: dots-drift 20s linear infinite; pointer-events: none; }
    @keyframes dots-drift { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }
    @keyframes pulse { 0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); } 50% { opacity: 1; transform: translateX(-50%) scale(1.12); } }
    .breadcrumb { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; z-index: 1; position: relative; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb span { opacity: 0.4; }
    .page-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(64px, 10vw, 130px); line-height: 0.9; letter-spacing: 2px; animation: fade-up 0.8s ease both; position: relative; z-index: 1; }
    .page-header h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .page-header p { color: var(--muted); font-size: 17px; font-weight: 300; margin-top: 16px; letter-spacing: 1px; animation: fade-up 0.8s 0.1s ease both; position: relative; z-index: 1; }
    .header-meta { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; justify-content: center; animation: fade-up 0.8s 0.2s ease both; position: relative; z-index: 1; }
    .meta-chip { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--border); padding: 8px 18px; border-radius: 100px; color: var(--muted); }
    .meta-chip.hot { border-color: rgba(244,119,46,0.3); color: var(--accent); background: rgba(244,119,46,0.07); }
    .hero-cta { position: relative; z-index: 1; margin-top: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 16px 44px; border-radius: 100px; background: linear-gradient(135deg, #E94E2C, var(--amber)); color: #1a0b04; text-decoration: none; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; box-shadow: 0 12px 36px rgba(233,78,44,.38); transition: transform .25s, box-shadow .25s; animation: fade-up 0.8s 0.3s ease both; }
    .hero-cta:hover { transform: translateY(-3px); box-shadow: 0 18px 44px rgba(233,78,44,.5); }

    .ticker-wrap { background: linear-gradient(90deg, #A90E02, #E94E2C 55%, #F4772E); padding: 12px 0; overflow: hidden; white-space: nowrap; }
    .ticker { display: inline-flex; animation: ticker 24s linear infinite; }
    .ticker span { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 4px; padding: 0 36px; color: white; }
    .ticker span::after { content: '✦'; margin-left: 36px; opacity: 0.6; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
