<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arambh - Premium T-Shirts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(150deg, #f4a896, #358597);
      overflow-x: hidden;
    }

    /* LOGO SECTION */
    .logo-section {
      text-align: center;
      padding: 20px;
      background: white;
    }

    .logo-section img {
      height: 80px;
      max-width: 90%;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .hero video,
    .hero img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 15px;
    }

    .hero h1 {
      margin-top: 20px;
      font-size: 40px;
      font-family: Cambria, serif;
      color: white;
    }

    /* COLLECTION BUTTONS */
    .collections {
      padding: 60px 20px;
      text-align: center;
    }

    .collection-btn {
      display: inline-block;
      margin: 15px;
      padding: 15px 35px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .collection-btn:hover {
      transform: translateY(-5px);
      background: #333;
    }

    /* SCROLL REVEAL */
    .reveal {
      opacity: 0;
      transform: translateY(60px);
      transition: all 0.8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

  </style>
</head>

<body>

  <!-- LOGO -->
  <div class="logo-section reveal">
    <img src="logo.png" alt="Arambh Logo">
  </div>

  <!-- MODEL SECTION -->
  <div class="hero reveal">

    <!-- Use VIDEO -->
    <video autoplay muted loop playsinline>
      <source src="model.mp4" type="video/mp4">
      <!-- If video fails, show image -->
      Your browser does not support video.
    </video>

    <!-- If you want image instead, comment video and use below -->
    <!-- <img src="model.jpg" alt="Model Wearing Arambh"> -->

    <h1>Wear Your Vibe</h1>
  </div>

  <!-- COLLECTION LINKS -->
  <div class="collections reveal">
    <a href="printed.html" class="collection-btn">Printed Collection</a>
    <a href="oversized.html" class="collection-btn">Oversized Collection</a>
  </div>

  <!-- SCROLL REVEAL SCRIPT (Error-Free Version) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("active");
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll(".reveal").forEach(el => {
        observer.observe(el);
      });

    });
  </script>

</body>
</html>
