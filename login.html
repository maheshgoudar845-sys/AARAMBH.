<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — AARAMBH</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="site-config.js"></script>
  <style>
    :root{--bg:#080810;--surface:#0f0f1a;--accent:#A90E02;--accent2:#FFFACD;--text:#f0f0f0;--muted:#888;--border:rgba(255,255,255,.08);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    nav{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid var(--border);}
    nav img{height:42px;}
    nav a.back{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-decoration:none;}
    .wrap{max-width:440px;margin:50px auto;padding:0 20px;}
    .card{background:linear-gradient(160deg,#0f0f1a,#15151f);border:1px solid var(--border);border-radius:22px;padding:30px;}
    h1{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:1px;margin-bottom:6px;}
    .sub{color:var(--muted);font-size:14px;margin-bottom:24px;line-height:1.6;}
    .g{margin-bottom:16px;}
    label{display:block;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:13px 15px;color:var(--text);font-family:inherit;font-size:14px;}
    input:focus{outline:none;border-color:rgba(169,14,2,.6);box-shadow:0 0 0 3px rgba(169,14,2,.15);}
    #msg{font-size:13px;margin:4px 0 14px;min-height:18px;line-height:1.5;}
    #msg.err{color:#ff6b6b;} #msg.ok{color:#9be6b4;}
    .btn{width:100%;padding:15px;background:var(--accent);color:#fff;border:none;border-radius:100px;font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
    .btn:disabled{opacity:.6;cursor:not-allowed;}
    .links{margin-top:18px;display:flex;flex-direction:column;gap:8px;text-align:center;font-size:13px;}
    .links a{color:var(--accent2);cursor:pointer;text-decoration:none;}
    .hide{display:none;}
  </style>
</head>
<body>
  <nav><a href="index.html"><img src="logo.webp" alt="AARAMBH"></a><a class="back" href="index.html">← Back to Shop</a></nav>
  <div class="wrap"><div class="card">
    <h1 id="title">Log in</h1>
    <p class="sub" id="sub"></p>
    <form id="f" novalidate>
      <div class="g" data-m="register"><label for="name">Full Name</label><input id="name" autocomplete="name" maxlength="80"></div>
      <div class="g" data-m="login register forgot"><label for="email">Email</label><input id="email" type="email" autocomplete="email" maxlength="120"></div>
      <div class="g" data-m="register"><label for="phone">Phone (optional)</label><input id="phone" type="tel" inputmode="numeric" maxlength="10"></div>
      <div class="g" data-m="login register reset"><label for="pw" id="pwLabel">Password</label><input id="pw" type="password" maxlength="100"></div>
      <div id="msg"></div>
      <button class="btn" id="go" type="submit"></button>
    </form>
    <div class="links" id="links"></div>
  </div></div>

  <script>
    const API = window.AARAMBH_BACKEND_URL || '';
    const $ = (id) => document.getElementById(id);
    const q = new URLSearchParams(location.search);
    const rawNext = q.get('next') || '';
    const next = /^[a-z0-9_-]+\.html(\?[^#\s]*)?$/i.test(rawNext) ? rawNext : 'account.html';
    const resetToken = q.get('reset') || '';
    let mode = resetToken ? 'reset' : 'login';
    if (mode !== 'reset' && localStorage.getItem('arambhToken')) location.replace(next);

    const TEXT = {
      login:    { t: 'Log in',          s: 'Welcome back. Log in to see your orders and autofill checkout.', b: 'Log in' },
      register: { t: 'Create account',  s: 'Save your details for faster checkout and track your orders.',   b: 'Create account' },
      forgot:   { t: 'Forgot password', s: 'Enter your email and we will send you a link to reset it.',      b: 'Send reset link' },
      reset:    { t: 'New password',    s: 'Choose a new password of at least 8 characters.',                b: 'Save password' }
    };
    function show(m) {
      mode = m;
      $('title').textContent = TEXT[m].t;
      $('sub').textContent = TEXT[m].s;
      $('go').textContent = TEXT[m].b;
      document.title = TEXT[m].t + ' — AARAMBH';
      document.querySelectorAll('[data-m]').forEach((el) => el.classList.toggle('hide', !el.dataset.m.split(' ').includes(m)));
      $('pw').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      $('pwLabel').textContent = m === 'reset' ? 'New password' : 'Password';
      $('msg').textContent = ''; $('msg').className = '';
      const L = {
        login: '<a data-go="register">New here? Create an account</a><a data-go="forgot">Forgot your password?</a>',
        register: '<a data-go="login">Already have an account? Log in</a>',
        forgot: '<a data-go="login">Back to log in</a>',
        reset: ''
      };
      $('links').innerHTML = L[m];
    }
    $('links').addEventListener('click', (e) => { const a = e.target.closest('[data-go]'); if (a) show(a.dataset.go); });
    $('phone').addEventListener('input', () => { $('phone').value = $('phone').value.replace(/\D/g, '').slice(0, 10); });

    function say(text, ok) { $('msg').textContent = text; $('msg').className = ok ? 'ok' : 'err'; }

    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!API || /YOUR-RENDER-URL/.test(API)) return say('Accounts are not available yet. Please try again later.');
      const email = $('email').value.trim(), pw = $('pw').value;
      if (mode !== 'reset' && !/^\S+@\S+\.\S+$/.test(email)) return say('Please enter a valid email.');
      if (mode !== 'forgot' && pw.length < (mode === 'login' ? 1 : 8)) return say(mode === 'login' ? 'Please enter your password.' : 'Password must be at least 8 characters.');
      if (mode === 'register' && !$('name').value.trim()) return say('Please enter your name.');

      const path = { login: '/api/auth/login', register: '/api/auth/register', forgot: '/api/auth/forgot', reset: '/api/auth/reset' }[mode];
      const body = {
        login: { email, password: pw },
        register: { name: $('name').value.trim(), email, phone: $('phone').value, password: pw },
        forgot: { email },
        reset: { token: resetToken, password: pw }
      }[mode];

      $('go').disabled = true;
      say('Please wait… (the first request can take up to a minute)', true);
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 75000);
      try {
        const res = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctrl.signal });
        const out = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(out.error || 'Something went wrong. Please try again.');
        if (mode === 'forgot') { say('If that email has an account, a reset link is on its way. Check your spam folder too.', true); $('go').disabled = false; return; }
        localStorage.setItem('arambhToken', out.token);
        localStorage.setItem('arambhUser', JSON.stringify(out.user || {}));
        if (resetToken) history.replaceState(null, '', 'login.html');
        location.href = next;
      } catch (err) {
        say(err.name === 'AbortError' ? 'The server took too long. Please try again.' : err.name === 'TypeError' ? 'Could not reach the server. Check your internet and try again.' : err.message);
        $('go').disabled = false;
      } finally { clearTimeout(timer); }
    });

    show(mode);
  </script>
</body>
</html>
