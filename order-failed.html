<script>
    const q = new URLSearchParams(location.search);
    const reason = q.get('reason');
    const msg = document.getElementById('message');
    const retryBtn = document.querySelector('.btn');
    const paras = document.querySelectorAll('p');
    retryBtn.href = 'order.html?retry=1';
    if (reason === 'pending') {
      msg.textContent = 'Your payment is still being processed by your bank. Please do not pay again yet. Contact us with your order reference' + (q.get('order') ? ' (' + q.get('order') + ')' : '') + ' and we will check it for you.';
      paras[1].style.display = 'none';
      retryBtn.style.display = 'none';
    } else if (reason === 'verification' || reason === 'server' || reason === 'amount' || reason === 'not-found') {
      msg.textContent = 'We could not verify your payment. Please contact us before trying again so we can check it.';
    }
  </script>
