<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oversized Collection - Arambh</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#000;
  color:#fff;
}

/* HERO HEADER */
.page-header{
  background:linear-gradient(to right,#000,#111,#000);
  padding:80px 20px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.page-header h1{
  font-size:55px;
  font-weight:800;
  letter-spacing:3px;
}

.page-header p{
  color:#aaa;
  margin-top:10px;
  font-size:16px;
}

.back-link{
  display:inline-block;
  margin-top:25px;
  color:#fff;
  text-decoration:none;
  font-weight:600;
  border:1px solid #fff;
  padding:8px 20px;
  border-radius:30px;
  transition:0.3s;
}

.back-link:hover{
  background:#fff;
  color:#000;
}

/* SECTION */
.section{
  padding:80px 40px;
}

/* GRID */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:35px;
}

/* CARD */
.product-card{
  background:#111;
  border-radius:18px;
  overflow:hidden;
  transition:0.4s;
  text-align:center;
  border:1px solid rgba(255,255,255,0.08);
}

.product-card:hover{
  transform:translateY(-10px);
  box-shadow:0 25px 50px rgba(255,255,255,0.08);
}

.product-card img{
  width:100%;
  height:280px;
  object-fit:contain;
  padding:20px;
  background:#000;
  transition:0.4s;
}

.product-card:hover img{
  transform:scale(1.05);
}

.product-info{
  padding:20px;
}

.product-info h3{
  font-size:18px;
  font-weight:600;
  margin-bottom:5px;
}

.price{
  color:#ffb703;
  font-weight:700;
  font-size:18px;
}

/* SIZE CHART */
.size-section{
  max-width:600px;
  margin:100px auto 50px;
  background:#111;
  padding:30px;
  border-radius:20px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}

.size-section img{
  width:100%;
  border-radius:12px;
}

/* ORDER BUTTON */
.order-btn{
  display:block;
  width:fit-content;
  margin:40px auto 80px;
  padding:16px 45px;
  background:linear-gradient(135deg,#fff,#ccc);
  color:#000;
  text-decoration:none;
  font-weight:700;
  border-radius:50px;
  font-size:18px;
  transition:0.3s;
}

.order-btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 30px rgba(255,255,255,0.3);
}

/* SCROLL REVEAL */
.reveal{
  opacity:0;
  transform:translateY(60px);
  transition:1s;
}

.reveal.active{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="page-header">
  <h1>OVERSIZED COLLECTION</h1>
  <p>Comfort. Street. Power.</p>
  <a href="index.html" class="back-link">← Back to Home</a>
</div>

<div class="section">

  <div class="products">

    <div class="product-card reveal">
      <img src="oversized1.jpg" alt="">
      <div class="product-info">
        <h3>Light Blue</h3>
        <div class="price">₹329</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="oversized2.jpg" alt="">
      <div class="product-info">
        <h3>Dark Blue</h3>
        <div class="price">₹329</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="oversized3.png" alt="">
      <div class="product-info">
        <h3>Beige</h3>
        <div class="price">₹329</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="oversized4.png" alt="">
      <div class="product-info">
        <h3>White</h3>
        <div class="price">₹329</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="Oversized 5.jpeg" alt="">
      <div class="product-info">
        <h3>Black</h3>
        <div class="price">₹329</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="hoodie1.jpg" alt="">
      <div class="product-info">
        <h3>Beige Hoodie</h3>
        <div class="price">₹599</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="hoodie2.jpg" alt="">
      <div class="product-info">
        <h3>Black Hoodie</h3>
        <div class="price">₹599</div>
      </div>
    </div>

  </div>

</div>

<div class="size-section reveal">
  <img src="sizechart.jpg" alt="">
  <h3 style="margin-top:20px;">Please Check Size Chart Before Ordering</h3>
</div>

<a href="https://forms.gle/g4AaQk4dXQy3acXM6" target="_blank" class="order-btn">
  ORDER NOW
</a>

<script>
window.addEventListener("scroll", function(){
  let reveals = document.querySelectorAll(".reveal");
  for(let i=0;i<reveals.length;i++){
    let windowHeight = window.innerHeight;
    let elementTop = reveals[i].getBoundingClientRect().top;
    let elementVisible = 120;
    if(elementTop < windowHeight - elementVisible){
      reveals[i].classList.add("active");
    }
  }
});
</script>

</body>
</html>
