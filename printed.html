<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printed T-Shirts - Arambh</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  scroll-behavior:smooth;
}

body{
  background:#000;
  color:#fff;
}

/* HEADER */
.page-header{
  background:linear-gradient(to right,#000,#111,#000);
  padding:80px 20px;
  text-align:center;
}

.page-header h1{
  font-size:55px;
  font-weight:800;
  letter-spacing:3px;
}

.page-header p{
  margin-top:10px;
  color:#aaa;
}

.back-link{
  display:inline-block;
  margin-top:25px;
  color:#fff;
  text-decoration:none;
  font-weight:600;
  border:1px solid #fff;
  padding:8px 22px;
  border-radius:30px;
  transition:0.3s;
}

.back-link:hover{
  background:#fff;
  color:#000;
}

/* SECTION */
.section{
  padding:80px 40px;
}

/* GRID */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:35px;
}

/* CARD */
.product-card{
  background:#111;
  border-radius:20px;
  overflow:hidden;
  transition:0.4s;
  text-align:center;
  border:1px solid rgba(255,255,255,0.08);
}

.product-card:hover{
  transform:translateY(-10px);
  box-shadow:0 25px 50px rgba(255,255,255,0.08);
}

/* MEDIA */
.product-card video,
.product-card img{
  width:100%;
  height:300px;
  object-fit:cover;
  background:#000;
  transition:0.4s;
}

.product-card:hover video,
.product-card:hover img{
  transform:scale(1.05);
}

.product-info{
  padding:20px;
}

.product-info h3{
  font-size:18px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:8px;
}

.price{
  color:#ffb703;
  font-weight:700;
  font-size:18px;
}

/* SIZE CHART */
.size-section{
  max-width:600px;
  margin:100px auto 50px;
  background:#111;
  padding:30px;
  border-radius:20px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}

.size-section img{
  width:100%;
  border-radius:12px;
}

.size-section h3{
  margin-top:20px;
}

/* ORDER BUTTON */
.order-btn{
  display:block;
  width:fit-content;
  margin:40px auto 80px;
  padding:16px 45px;
  background:linear-gradient(135deg,#fff,#ccc);
  color:#000;
  text-decoration:none;
  font-weight:700;
  border-radius:50px;
  font-size:18px;
  transition:0.3s;
}

.order-btn:hover{
  transform:scale(1.05);
  box-shadow:0 10px 30px rgba(255,255,255,0.3);
}

/* SCROLL REVEAL */
.reveal{
  opacity:0;
  transform:translateY(60px);
  transition:1s;
}

.reveal.active{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="page-header">
  <h1>PRINTED COLLECTION</h1>
  <p>Express. Bold. Street.</p>
  <a href="index.html" class="back-link">← Back to Home</a>
</div>

<div class="section">

  <div class="products">

    <!-- VIDEO PRODUCTS -->
    <div class="product-card reveal">
      <video autoplay muted loop playsinline>
        <source src="printed1.mp4" type="video/mp4">
      </video>
      <div class="product-info">
        <h3>STAY WILD</h3>
        <div class="price">₹349</div>
      </div>
    </div>

    <div class="product-card reveal">
      <video autoplay muted loop playsinline>
        <source src="printed2.mp4" type="video/mp4">
      </video>
      <div class="product-info">
        <h3>SELF LOVE CLUB</h3>
        <div class="price">₹349</div>
      </div>
    </div>

    <div class="product-card reveal">
      <video autoplay muted loop playsinline>
        <source src="printed3.mp4" type="video/mp4">
      </video>
      <div class="product-info">
        <h3>THE GOOD LIFE</h3>
        <div class="price">₹349</div>
      </div>
    </div>

    <div class="product-card reveal">
      <video autoplay muted loop playsinline>
        <source src="printed4.mp4" type="video/mp4">
      </video>
      <div class="product-info">
        <h3>PORSCHE CAR</h3>
        <div class="price">₹349</div>
      </div>
    </div>

    <div class="product-card reveal">
      <video autoplay muted loop playsinline>
        <source src="printed5.mp4" type="video/mp4">
      </video>
      <div class="product-info">
        <h3>HELLO</h3>
        <div class="price">₹349</div>
      </div>
    </div>

    <!-- IMAGE PRODUCTS -->
    <div class="product-card reveal">
      <img src="Kufu_white.jpeg" alt="Kufu Panda White">
      <div class="product-info">
        <h3>Kufu Panda White</h3>
        <div class="price">₹349</div>
      </div>
    </div>

    <div class="product-card reveal">
      <img src="Kufu_black.jpeg" alt="Kufu Panda Black">
      <div class="product-info">
        <h3>Kufu Panda Black</h3>
        <div class="price">₹349</div>
      </div>
    </div>

  </div>
</div>

<!-- SIZE CHART -->
<div class="size-section reveal">
  <img src="sizechart.png" alt="Size Chart">
  <h3>Please Check Size Chart Before Ordering</h3>
</div>

<a href="https://forms.gle/g4AaQk4dXQy3acXM6" target="_blank" class="order-btn">
  ORDER NOW
</a>

<script>
function reveal(){
  let reveals = document.querySelectorAll(".reveal");
  reveals.forEach(el=>{
    let windowHeight = window.innerHeight;
    let elementTop = el.getBoundingClientRect().top;
    if(elementTop < windowHeight - 120){
      el.classList.add("active");
    }
  });
}

window.addEventListener("scroll", reveal);
window.addEventListener("load", reveal);
</script>

</body>
</html>
